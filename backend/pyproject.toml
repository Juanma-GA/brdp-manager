[project]
name = "brdp-manager-backend"
version = "2.0.0"
description = "BRDP Manager v2 backend — FastAPI + SQLAlchemy async + Postgres/pgvector. CRUD, auth, authorization, LLM proxy and similarity search only (see docs/v2/03-especificacion-v2-para-claude-code.md §4 — never builds prompts)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "pgvector>=0.3.5",
    "httpx>=0.27",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    # Dev-only convenience for corporate SSL-inspecting proxies (README
    # "Troubleshooting: Corporate Network / SSL-Inspecting Proxy" #3):
    # patches Python's ssl module to trust the OS certificate store
    # (where the corporate root CA is normally already installed) instead
    # of only certifi's bundled list, so httpx calls to Mistral/Qwen work
    # without hand-setting SSL_CERT_FILE/REQUESTS_CA_BUNDLE. NOT a
    # production fix -- a real deployment installs the corporate root CA
    # into the server OS's trust store directly, same as always.
    "pip-system-certs>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
