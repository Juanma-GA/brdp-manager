[project]
name = "brdp-manager-backend"
version = "2.0.0"
description = "BRDP Manager v2 backend — FastAPI + SQLAlchemy async + Postgres/pgvector. CRUD, auth, authorization, LLM proxy and similarity search only (see docs/v2/03-especificacion-v2-para-claude-code.md §4 — never builds prompts)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt[crypto]>=2.9",
    "pgvector>=0.3.5",
    "httpx>=0.27",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
